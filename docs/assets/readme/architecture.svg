<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" role="img" aria-labelledby="title desc">
  <title id="title">Extension architecture overview</title>
  <desc id="desc">Placeholder architecture diagram for content script, popup, service worker, source adapters, and KiCad output.</desc>
  <rect width="980" height="460" rx="18" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1155cc"/>
    </marker>
  </defs>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">
    <g transform="translate(70 76)">
      <rect width="180" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="90" y="38" text-anchor="middle" font-size="18" font-weight="700">Content script</text>
      <text x="90" y="62" text-anchor="middle" font-size="13" fill="#475569">detects page context</text>
    </g>
    <g transform="translate(400 76)">
      <rect width="180" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="90" y="38" text-anchor="middle" font-size="18" font-weight="700">Popup</text>
      <text x="90" y="62" text-anchor="middle" font-size="13" fill="#475569">previews and export UI</text>
    </g>
    <g transform="translate(730 76)">
      <rect width="180" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="90" y="38" text-anchor="middle" font-size="18" font-weight="700">Runtime</text>
      <text x="90" y="62" text-anchor="middle" font-size="13" fill="#475569">routes provider work</text>
    </g>
    <g transform="translate(235 280)">
      <rect width="220" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="110" y="38" text-anchor="middle" font-size="18" font-weight="700">Source adapters</text>
      <text x="110" y="64" text-anchor="middle" font-size="13" fill="#475569">EasyEDA and SamacSys</text>
    </g>
    <g transform="translate(575 280)">
      <rect width="220" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="110" y="38" text-anchor="middle" font-size="18" font-weight="700">KiCad output</text>
      <text x="110" y="64" text-anchor="middle" font-size="13" fill="#475569">symbols, footprints, models</text>
    </g>
  </g>
  <g stroke="#1155cc" stroke-width="4" marker-end="url(#arrow)" fill="none">
    <path d="M250 118 h126"/>
    <path d="M580 118 h126"/>
    <path d="M820 164 C820 230 455 212 455 276"/>
    <path d="M456 326 h96"/>
  </g>
</svg>
